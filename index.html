<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>植物大战僵尸 - 塔防游戏</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div id="sun-counter">
        <span id="sun-icon">☀️</span>
        <span id="sun-amount">150</span>
      </div>
      <div id="plant-cards"></div>
      <div id="wave-info">
        <span id="wave-text">第 1/5 波</span>
        <div id="progress-bar"><div id="progress-fill"></div></div>
      </div>
      <div id="score-info">
        <span id="score-text">得分 0</span>
      </div>
      <button id="shovel-btn" title="铲子 - 铲除植物回收 50% 阳光">🪏</button>
      <button id="mute-btn" title="音效开/关">🔊</button>
      <button id="pause-btn" title="菜单 / 暂停">☰</button>
    </div>
    <canvas id="game-canvas" width="960" height="600"></canvas>
    <div id="menu-overlay" class="overlay">
      <h1>🌻 植物大战僵尸 🌻</h1>
      <p>保卫你的家园！放置植物，抵御僵尸入侵。</p>
      <p id="menu-stats" style="font-size:14px;color:#8bc34a;margin-bottom:8px;"></p>
      <p id="level-info" style="font-size:16px;color:#ffd700;margin-bottom:15px;"></p>
      <button id="start-btn">开始游戏</button>
      <button id="endless-btn" style="margin-top:12px;">♾️ 无尽模式</button>
      <div id="help-text">
        <p>🖱️ 点击植物卡片，再点击草地放置植物</p>
        <p>☀️ 点击收集阳光，向日葵会生产阳光</p>
        <p>🧟 阻止僵尸到达左侧房屋！</p>
        <p>🪏 点击铲子再点植物可铲除，回收 50% 阳光</p>
        <p>🚜 每行有一台小推车，僵尸破防时会清整行</p>
      </div>
    </div>
    <div id="result-overlay" class="overlay hidden">
      <h1 id="result-title"></h1>
      <p id="result-text"></p>
      <button id="restart-btn">再来一局</button>
      <button id="checkpoint-btn" class="hidden">从检查点继续</button>
    </div>
    <div id="pause-overlay" class="overlay hidden">
      <h1>⏸ 暂停</h1>
      <div id="pause-menu">
        <button id="resume-btn">继续游戏</button>
        <button id="restart-pause-btn">重新开始</button>
        <button id="level-select-btn">选择关卡</button>
        <button id="main-menu-btn">返回主页</button>
      </div>
      <div id="level-select" class="hidden">
        <h2>选择关卡</h2>
        <div id="level-grid"></div>
        <button id="back-btn">返回</button>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/save.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/plants.js"></script>
  <script src="js/zombies.js"></script>
  <script src="js/level.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
